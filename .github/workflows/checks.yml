name: Checks

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: shuetl-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test --extra sqlite --extra postgresql

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Boundary checks
        run: uv run python scripts/check_boundaries.py

      - name: Tests
        run: uv run pytest -q

  postgresql-integration:
    name: PostgreSQL integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_USER: shuetl
          POSTGRES_PASSWORD: shuetl
          POSTGRES_DB: shuetl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuetl -d shuetl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHUETL_PROFILE: postgresql-pilot
      SHUETL_ROLE: gateway
      SHUETL_PROVIDER: postgresql
      SHUETL_IDENTITY: host
      SHUETL_DATABASE_URL: postgresql+psycopg://shuetl:shuetl@localhost:5432/shuetl
      SHUETL_POSTGRESQL_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test --extra sqlite --extra postgresql

      - name: Require configured PostgreSQL service
        run: test -n "$SHUETL_DATABASE_URL"

      - name: Run PostgreSQL integration tests
        run: uv run pytest tests/integration/test_postgresql.py -q --junitxml="$RUNNER_TEMP/postgresql-tests.xml"

      - name: Reject skipped PostgreSQL tests
        run: uv run python scripts/check_pytest_no_skips.py "$RUNNER_TEMP/postgresql-tests.xml"

  release-gate:
    name: Phase 0.5 release gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    needs: [quality, postgresql-integration]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test --extra sqlite --extra postgresql

      - name: Run release gate
        run: uv run python scripts/check_release.py

      - name: Upload distributions and evidence
        uses: actions/upload-artifact@v7
        with:
          name: shuetl-0.5-artifacts-${{ matrix.python-version }}
          path: |
            dist/*
            docs/evidence/0.5/openapi.normalized.json
