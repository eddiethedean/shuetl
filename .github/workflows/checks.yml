name: Checks

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: shuetl-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test --extra sqlite --extra postgresql --extra server

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Boundary checks
        run: uv run python scripts/check_boundaries.py

      - name: Tests
        run: uv run pytest -q

  postgresql-integration:
    name: PostgreSQL integration (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        # Docker Official Images on ECR Public avoid shared-runner Docker Hub limits.
        image: public.ecr.aws/docker/library/postgres:18.6-bookworm
        env:
          POSTGRES_USER: shuetl
          POSTGRES_PASSWORD: shuetl
          POSTGRES_DB: shuetl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuetl -d shuetl"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SHUETL_PROFILE: postgresql-pilot
      SHUETL_ROLE: gateway
      SHUETL_PROVIDER: postgresql
      SHUETL_IDENTITY: host
      SHUETL_DATABASE_URL: postgresql+psycopg://shuetl:shuetl@localhost:5432/shuetl
      SHUETL_POSTGRESQL_SSLMODE: disable
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test --extra sqlite --extra postgresql --extra server

      - name: Require configured PostgreSQL service
        run: test -n "$SHUETL_DATABASE_URL"

      - name: Run PostgreSQL integration tests
        run: uv run pytest tests/integration/test_postgresql.py -q --junitxml="$RUNNER_TEMP/postgresql-tests.xml"

      - name: Reject skipped PostgreSQL tests
        run: uv run python scripts/check_pytest_no_skips.py "$RUNNER_TEMP/postgresql-tests.xml"

  phase06-cli-runtime:
    name: Installed CLI PostgreSQL roles (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-bookworm
        env:
          POSTGRES_USER: shuetl
          POSTGRES_PASSWORD: shuetl
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuetl -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build ShuETL and isolated reference host wheels
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/shuetl-dist"
          uv build tests/reference_phase06_host --wheel \
            --out-dir "$RUNNER_TEMP/host-dist"

      - name: Install wheels outside the source checkout
        run: |
          uv venv "$RUNNER_TEMP/phase06-venv" --python "${{ matrix.python-version }}"
          SHUETL_WHEEL="$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)"
          HOST_WHEEL="$(find "$RUNNER_TEMP/host-dist" -name '*.whl' -print -quit)"
          uv pip install --python "$RUNNER_TEMP/phase06-venv/bin/python" \
            "${SHUETL_WHEEL}[postgresql,server]" "$HOST_WHEEL"

      - name: Qualify installed role CLI on PostgreSQL 18.6
        run: |
          "$RUNNER_TEMP/phase06-venv/bin/python" spikes/phase_0_6_cli_gate.py --active --force \
            --disposable-admin-url postgresql+psycopg://shuetl:shuetl@127.0.0.1:5432/postgres \
            --python "$RUNNER_TEMP/phase06-venv/bin/python" \
            --shuetl-wheel "$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)" \
            --reference-wheel "$(find "$RUNNER_TEMP/host-dist" -name '*.whl' -print -quit)" \
            --source-commit "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/cli-postgresql-${{ matrix.python-version }}.json"

      - name: Rehearse retained 0.5 and fresh 0.6 store transition
        run: |
          uv venv "$RUNNER_TEMP/retained-venv" --python "${{ matrix.python-version }}"
          uv pip install --python "$RUNNER_TEMP/retained-venv/bin/python" 'shuetl[postgresql]==0.5.0'
          "$RUNNER_TEMP/phase06-venv/bin/python" spikes/phase_0_6_transition.py \
            --disposable-admin-url postgresql+psycopg://shuetl:shuetl@127.0.0.1:5432/postgres \
            --retained-python "$RUNNER_TEMP/retained-venv/bin/python" \
            --candidate-python "$RUNNER_TEMP/phase06-venv/bin/python" \
            --source-commit "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/transition-${{ matrix.python-version }}.json"

      - name: Upload installed role evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase06-cli-postgresql-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/cli-postgresql-${{ matrix.python-version }}.json
            ${{ runner.temp }}/transition-${{ matrix.python-version }}.json

  phase06-container:
    name: Installed container PostgreSQL roles (host Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-bookworm
        env:
          POSTGRES_USER: shuetl
          POSTGRES_PASSWORD: shuetl
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuetl -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build ShuETL and isolated reference host wheels
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/shuetl-dist"
          uv build tests/reference_phase06_host --wheel \
            --out-dir "$RUNNER_TEMP/host-dist"

      - name: Install wheels outside the source checkout
        run: |
          uv venv "$RUNNER_TEMP/phase06-venv" --python "${{ matrix.python-version }}"
          SHUETL_WHEEL="$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)"
          HOST_WHEEL="$(find "$RUNNER_TEMP/host-dist" -name '*.whl' -print -quit)"
          uv pip install --python "$RUNNER_TEMP/phase06-venv/bin/python" \
            "${SHUETL_WHEEL}[postgresql,server]" "$HOST_WHEEL"

      - name: Build one image for all roles
        run: |
          mkdir -p "$RUNNER_TEMP/container/wheels"
          cp examples/deployment/Dockerfile "$RUNNER_TEMP/container/Dockerfile"
          cp "$RUNNER_TEMP/shuetl-dist/"*.whl "$RUNNER_TEMP/container/wheels/"
          cp "$RUNNER_TEMP/host-dist/"*.whl "$RUNNER_TEMP/container/wheels/"
          docker build --platform linux/amd64 -t shuetl-qualification "$RUNNER_TEMP/container"

      - name: Qualify installed container roles on PostgreSQL 18.6
        run: |
          "$RUNNER_TEMP/phase06-venv/bin/python" spikes/phase_0_6_cli_gate.py --active \
            --container-image "$(docker image inspect shuetl-qualification --format '{{.Id}}')" \
            --disposable-admin-url postgresql+psycopg://shuetl:shuetl@127.0.0.1:5432/postgres \
            --python "$RUNNER_TEMP/phase06-venv/bin/python" \
            --shuetl-wheel "$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)" \
            --reference-wheel "$(find "$RUNNER_TEMP/host-dist" -name '*.whl' -print -quit)" \
            --source-commit "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/container-postgresql-${{ matrix.python-version }}.json"

      - name: Upload installed container evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase06-container-postgresql-${{ matrix.python-version }}
          path: ${{ runner.temp }}/container-postgresql-${{ matrix.python-version }}.json

  phase06-gate0:
    name: Installed PostgreSQL Gate 0 (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-bookworm
        env:
          POSTGRES_USER: shuetl
          POSTGRES_PASSWORD: shuetl
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuetl -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}

      - name: Build isolated qualification wheels
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/shuetl-dist"
          uv build tests/reference_phase06 --wheel \
            --out-dir "$RUNNER_TEMP/reference-dist"

      - name: Install wheels outside the source checkout
        run: |
          uv venv "$RUNNER_TEMP/gate0-venv" --python "${{ matrix.python-version }}"
          SHUETL_WHEEL="$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)"
          REFERENCE_WHEEL="$(find "$RUNNER_TEMP/reference-dist" -name '*.whl' -print -quit)"
          uv pip install --python "$RUNNER_TEMP/gate0-venv/bin/python" \
            "${SHUETL_WHEEL}[postgresql,test]" "$REFERENCE_WHEEL"

      - name: Qualify installed Gate 0 transfer and role composition
        run: |
          "$RUNNER_TEMP/gate0-venv/bin/python" -I spikes/phase_0_6_gate_0.py --controls --resources --retention \
            --disposable-admin-url postgresql+psycopg://shuetl:shuetl@127.0.0.1:5432/postgres \
            --python "$RUNNER_TEMP/gate0-venv/bin/python" \
            --shuetl-wheel "$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)" \
            --reference-wheel "$(find "$RUNNER_TEMP/reference-dist" -name '*.whl' -print -quit)" \
            --source-commit "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/postgresql-gate0-${{ matrix.python-version }}.json"

      - name: Qualify installed provider action requirements
        run: |
          "$RUNNER_TEMP/gate0-venv/bin/python" -I docs/reviews/etlantic_0_57_2/requirements_probe.py \
            --disposable-admin-url postgresql+psycopg://shuetl:shuetl@127.0.0.1:5432/postgres \
            --output "$RUNNER_TEMP/action-requirements-${{ matrix.python-version }}.json"

      - name: Upload installed Gate 0 evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase06-gate0-postgresql-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/postgresql-gate0-${{ matrix.python-version }}.json
            ${{ runner.temp }}/action-requirements-${{ matrix.python-version }}.json

  phase06-faults:
    name: Installed PostgreSQL crash recovery (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18.6-bookworm
        env:
          POSTGRES_USER: shuetl
          POSTGRES_PASSWORD: shuetl
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shuetl -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}

      - name: Build isolated qualification wheels
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/shuetl-dist"
          uv build tests/reference_phase06 --wheel \
            --out-dir "$RUNNER_TEMP/reference-dist"

      - name: Install wheels outside the source checkout
        run: |
          uv venv "$RUNNER_TEMP/gate0-venv" --python "${{ matrix.python-version }}"
          SHUETL_WHEEL="$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)"
          REFERENCE_WHEEL="$(find "$RUNNER_TEMP/reference-dist" -name '*.whl' -print -quit)"
          uv pip install --python "$RUNNER_TEMP/gate0-venv/bin/python" \
            "${SHUETL_WHEEL}[postgresql,test]" "$REFERENCE_WHEEL"

      - name: Qualify installed Gate 0 transfer and role composition
        run: |
          "$RUNNER_TEMP/gate0-venv/bin/python" -I spikes/phase_0_6_gate_0.py --faults --controls --resources --retention \
            --disposable-admin-url postgresql+psycopg://shuetl:shuetl@127.0.0.1:5432/postgres \
            --python "$RUNNER_TEMP/gate0-venv/bin/python" \
            --shuetl-wheel "$(find "$RUNNER_TEMP/shuetl-dist" -name '*.whl' -print -quit)" \
            --reference-wheel "$(find "$RUNNER_TEMP/reference-dist" -name '*.whl' -print -quit)" \
            --source-commit "${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/postgresql-faults-${{ matrix.python-version }}.json"

      - name: Upload installed crash evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase06-faults-postgresql-${{ matrix.python-version }}
          path: ${{ runner.temp }}/postgresql-faults-${{ matrix.python-version }}.json

  release-gate:
    name: Phase 0.6 release gate (Python ${{ matrix.python-version }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [quality, postgresql-integration, phase06-cli-runtime, phase06-gate0, phase06-faults, phase06-container]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Download Phase 0.6 qualification artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: phase06-*
          path: ${{ runner.temp }}/phase06-hosted

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test --extra sqlite --extra postgresql --extra server

      - name: Run release gate
        run: uv run python scripts/check_release.py

      - name: Bind hosted qualification to this release commit
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          uv run python scripts/check_hosted_evidence.py \
            --artifacts "$RUNNER_TEMP/phase06-hosted" \
            --evidence docs/evidence/0.6 \
            --source-commit "$SOURCE_COMMIT"

      - name: Upload distributions and evidence
        uses: actions/upload-artifact@v7
        with:
          name: shuetl-0.6-artifacts-${{ matrix.python-version }}
          path: |
            dist/*
            docs/evidence/0.6/openapi.normalized.json
