name: Checks

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: shuetl-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Pyright
        run: uv run pyright

      - name: Boundary checks
        run: uv run python scripts/check_boundaries.py

      - name: Tests
        run: uv run pytest -q

  release-gate:
    name: Phase 0.2 release gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.3"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --all-groups --extra test

      - name: Run release gate
        run: uv run python scripts/check_release.py

      - name: Upload distributions and evidence
        uses: actions/upload-artifact@v4
        with:
          name: shuetl-0.2-artifacts-${{ matrix.python-version }}
          path: |
            dist/*
            docs/evidence/0.2/openapi.normalized.json
