name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: shuetl-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: Build distributions
    runs-on: ubuntu-24.04
    needs: checks
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: false

      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION=$(uv run --no-sync python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"

      - name: Build distributions
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: |
          uv build
          uv run --no-sync python scripts/check_artifact.py --dist dist
          uv run --no-sync python scripts/check_evidence.py --evidence docs/evidence/0.6

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: shuetl-release-${{ github.ref_name }}
          path: dist/*

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/shuetl
    steps:
      - uses: actions/checkout@v7

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: shuetl-release-${{ github.ref_name }}
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.3"
          python-version: "3.11"
          enable-cache: false

      - name: Verify published files match qualified evidence
        env:
          SOURCE_DATE_EPOCH: "1580601600"
        run: uv run --no-sync python scripts/check_evidence.py --evidence docs/evidence/0.6

      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@v1.14.2
