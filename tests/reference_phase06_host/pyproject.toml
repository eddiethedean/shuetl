[project]
name = "shuetl-phase06-host"
version = "0.0.1"
requires-python = ">=3.11,<3.14"
dependencies = [
    "shuetl[postgresql,server]==0.6.0",
    "etlantic-sql==0.57.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phase06_host"]
